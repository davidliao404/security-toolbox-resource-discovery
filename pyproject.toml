[project]
name = "resource-discovery-poc"
version = "0.1.0"
description = "Offline-first internet exposure resource discovery PoC for Security Toolbox."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "redis>=5.0",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "prometheus-client>=0.20",
  "structlog>=24.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resource_discovery = ["risk_rules.yml"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "coverage>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/resource_discovery"]

[tool.coverage.report]
fail_under = 98
precision = 2
show_missing = true
