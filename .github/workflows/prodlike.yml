name: production-like-gateway

on:
  push:
    branches: ["master", "codex/**"]
  pull_request:

jobs:
  postgres-redis-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resource_discovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resource_discovery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run migrations
        env:
          RESOURCE_DISCOVERY_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resource_discovery
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run tests
        env:
          RESOURCE_DISCOVERY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resource_discovery
          RESOURCE_DISCOVERY_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production-like compose
        run: docker compose -f docker-compose.prodlike.yml config
